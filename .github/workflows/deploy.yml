name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  # Rebuild daily so future-dated posts go live when their date arrives (UTC)
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: t0ma5/github-pages-blog-action@v0.1.0
        with:
          branch: gh-pages
